name: Package Windows
run-name: Package Windows · ${{ github.ref_name }}

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  package:
    if: github.event.deleted == false
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOOS: windows
      GOARCH: amd64
      CC: gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Verify dependencies and tests
        run: |
          go mod verify
          go test -tags ci ./...
          go vet -tags ci ./...
      - name: Build Windows application
        run: |
          mkdir -p dist/package
          windres -i assets/windows.rc -O coff -o app_windows_amd64.syso
          go build -ldflags "-s -w -H=windowsgui -extldflags=-static" -o dist/package/CodexCommandTrace.exe .
          cp README.md dist/package/README.md
          cd dist/package
          sha256sum CodexCommandTrace.exe > SHA256SUMS.txt
      - name: Create ZIP
        id: archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $safeTag = [regex]::Replace($env:RELEASE_TAG, '[^A-Za-z0-9._-]', '_')
          $name = "codex-cmd-trace-$safeTag-windows-amd64"
          $path = "dist/$name.zip"
          Compress-Archive -Path dist/package/* -DestinationPath $path
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$env:PACKAGE_PATH" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$env:PACKAGE_PATH" --verify-tag --title "$env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
